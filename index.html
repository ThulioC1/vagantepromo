<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine de Ofertas - Vagante Promo</title>
    <style>
        :root {
            --bg-color: #0c1626;
            --card-bg: #132238;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --price-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid #1e293b;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .container.active {
            display: grid;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #1e293b;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            background-color: #ffffff;
            padding: 10px;
            box-sizing: border-box;
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-title {
            font-size: 14px;
            line-height: 1.4;
            margin: 0 0 15px 0;
            color: var(--text-color);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price-box {
            margin-bottom: 15px;
        }

        .old-price {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: line-through;
            margin: 0;
        }

        .current-price {
            font-size: 20px;
            font-weight: bold;
            color: var(--price-color);
            margin: 2px 0 0 0;
        }

        .btn-buy {
            background-color: var(--accent-color);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .btn-buy:hover {
            background-color: var(--accent-hover);
        }

        .time {
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🔥 Vagante Promo - Melhores Ofertas</h1>
        <p>Atualizado em tempo real direto do Mercado Livre</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('eletronicos')">🎮 Eletrônicos & Games</button>
        <button class="tab-btn" onclick="switchTab('geral')">🛒 Ofertas Gerais</button>
    </div>

    <!-- Vitrine Eletrônicos -->
    <div id="grid-eletronicos" class="container active"></div>

    <!-- Vitrine Geral -->
    <div id="grid-geral" class="container"></div>

    <script>
        function switchTab(category) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.container').forEach(cont => cont.classList.remove('active'));

            if (category === 'eletronicos') {
                document.querySelector('.tabs button:nth-child(1)').classList.add('active');
                document.getElementById('grid-eletronicos').classList.add('active');
            } else {
                document.querySelector('.tabs button:nth-child(2)').classList.add('active');
                document.getElementById('grid-geral').classList.add('active');
            }
        }

        async function loadVitrine(filename, gridId) {
            const grid = document.getElementById(gridId);
            try {
                const response = await fetch(filename + "?t=" + new Date().getTime());
                if (!response.ok) throw new Error("Erro ao carregar dados");
                
                const products = await response.json();
                if (products.length === 0) {
                    grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #94a3b8;'>Nenhuma oferta no momento.</p>";
                    return;
                }

                grid.innerHTML = products.map(p => `
                    <div class="card">
                        <img src="${p.image}" alt="${p.title}">
                        <div class="card-content">
                            <div>
                                <h2 class="card-title">${p.title}</h2>
                                <div class="price-box">
                                    ${p.original_price && p.original_price > p.price ? `<p class="old-price">R$ ${p.original_price.toFixed(2).replace('.', ',')}</p>` : ''}
                                    <p class="current-price">R$ ${p.price.toFixed(2).replace('.', ',')}</p>
                                </div>
                            </div>
                            <div>
                                <a href="${p.link}" target="_blank" class="btn-buy">Ver Oferta 🚀</a>
                                <div class="time">${p.time || ''}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #94a3b8;'>Aguardando primeiras postagens do bot...</p>";
            }
        }

        // Carrega os dados ao abrir a página
        loadVitrine('vitrine_eletronicos.json', 'grid-eletronicos');
        loadVitrine('vitrine_geral.json', 'grid-geral');

        // Atualiza a cada 5 minutos automaticamente
        setInterval(() => {
            loadVitrine('vitrine_eletronicos.json', 'grid-eletronicos');
            loadVitrine('vitrine_geral.json', 'grid-geral');
        }, 300000);
    </script>
</body>
</html>
