<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine de Ofertas</title>
    <style>
        :root {
            --bg-color: #0c1626;
            --card-bg: #132238;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --price-color: #22c55e;
            --old-price: #ef4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        .card-img-container {
            width: 100%;
            height: 220px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .card-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .card-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-pricing {
            margin-top: auto;
            margin-bottom: 16px;
        }
        .old-price {
            font-size: 0.85rem;
            color: var(--old-price);
            text-decoration: line-through;
            margin-bottom: 2px;
        }
        .current-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--price-color);
        }
        .card-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }
        .card-btn:hover {
            background-color: var(--accent-hover);
        }
        .loading, .empty {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-muted);
            padding: 40px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🔥 Vitrine de Ofertas</h1>
        <p>As melhores promoções selecionadas para você em um só lugar!</p>
    </header>

    <div class="container" id="vitrine-container">
        <div class="loading">Carregando ofertas...</div>
    </div>

    <script>
        async function loadVitrine() {
            const container = document.getElementById("vitrine-container");
            // Se estiver hospedado no Vercel Blob, substitua pela URL completa do vitrine.json ou mantenha relativo se estiver no mesmo servidor
            const jsonUrl = "vitrine.json?t=" + new Date().getTime();

            try {
                const response = await fetch(jsonUrl);
                if (!response.ok) throw new Error("Erro ao carregar dados.");
                
                const produtos = await response.json();
                
                if (!produtos || produtos.length === 0) {
                    container.innerHTML = '<div class="empty">Nenhuma oferta cadastrada no momento.</div>';
                    return;
                }

                container.innerHTML = "";
                produtos.forEach(p => {
                    const card = document.createElement("div");
                    card.className = "card";

                    let priceHtml = `<div class="current-price">R$ ${p.price.toFixed(2).replace('.', ',')}</div>`;
                    if (p.original_price && p.original_price > p.price) {
                        priceHtml = `
                            <div class="old-price">De R$ ${p.original_price.toFixed(2).replace('.', ',')}</div>
                            <div class="current-price">Por R$ ${p.price.toFixed(2).replace('.', ',')}</div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="card-img-container">
                            <img src="${p.image}" alt="${p.title}" loading="lazy">
                        </div>
                        <div class="card-content">
                            <div class="card-title">${p.title}</div>
                            <div class="card-pricing">${priceHtml}</div>
                            <a href="${p.link}" target="_blank" class="card-btn">Ver Oferta 🛒</a>
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="empty">Erro ao carregar as ofertas. Tente novamente mais tarde.</div>';
            }
        }

        loadVitrine();
    </script>
</body>
</html>
